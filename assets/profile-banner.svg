      <stop offset="0.55" stop-color="#102947"/>
      <stop offset="1" stop-color="#173E46"/>
    </linearGradient>
    <linearGradient id="line" x1="820" y1="30" x2="1100" y2="285" gradientUnits="userSpaceOnUse">
